<main class="digitalls-faq">
  <section class="digitalls-faq__hero">
    <h1 class="digitalls-faq__title">Perguntas? Nós Temos as Respostas</h1>
    <form class="digitalls-faq__hero__search">
      <i class="ri-search-2-line ri-xxs" (click)="search.focus()"></i>
      <input
      #search
      type="text"
      placeholder="Pesquise nas FAQs..."
      class="digitalls-faq__search-input"
      [(ngModel)]="searchValue"
      [ngModelOptions]="{standalone: true}"
      />
      <i class="ri-close-line ri-xxs" *ngIf="searchValue.length > 0" (click)="searchValue = ''"></i>
    </form>
  </section>
  
  <section class="digitalls-faq__content">
    <dt-accordion [accordion]="{title: 'title', content: 'content'}"></dt-accordion>
    </section>
</main>
