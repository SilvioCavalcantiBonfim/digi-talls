<header class="digitalls-header__wrapper">
  <dt-header-logo *ngIf="logo"></dt-header-logo>
  <nav class="digitalls-header__nav" [ngClass]="{'digitalls-header__nav--no-logo': !logo}">
    <a [routerLink]="'/'+route.path" class="digitalls-header__link" [ngClass]="{'digitalls-header__link--no-logo': !logo}" *ngFor="let route of routes">
    <span>{{route.title}}</span>
    <i [class]="'ri-'+route.icon+'-fill ri-lg'"></i>
    </a>
  </nav>
</header>
